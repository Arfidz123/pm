name: Build iOS IPA (Unsigned / Jailbreak)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 16
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '^16'

      - name: Verify and Ensure Xcode 16
        run: |
          echo "Current Xcode version:"
          xcodebuild -version
          CURRENT_VERSION=$(xcodebuild -version | head -n 1 | awk '{print $2}')
          echo "Detected version: $CURRENT_VERSION"
          # Fallback check if setup-xcode did not switch to 16
          if [[ "$CURRENT_VERSION" == 15* ]]; then
            echo "Available Xcode installations:"
            ls -d /Applications/Xcode*
            TARGET_XCODE=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -n 1)
            if [ -n "$TARGET_XCODE" ]; then
              echo "Switching to $TARGET_XCODE"
              sudo xcode-select -s "$TARGET_XCODE/Contents/Developer"
              echo "DEVELOPER_DIR=$TARGET_XCODE/Contents/Developer" >> $GITHUB_ENV
            fi
          fi
          xcodebuild -version

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install npm dependencies
        run: npm install --legacy-peer-deps

      - name: Setup Ruby and Bundler
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Install CocoaPods
        run: |
          cd ios
          bundle exec pod install || pod install

      - name: Build unsigned iOS app
        run: |
          xcodebuild clean build \
            -workspace ios/CMMSApp.xcworkspace \
            -scheme CMMSApp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath derived_data \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package IPA
        run: |
          APP_PATH="derived_data/Build/Products/Release-iphoneos/CMMSApp.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Error: $APP_PATH not found"
            exit 1
          fi
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r CMMSApp-unsigned.ipa Payload
          rm -rf Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CMMSApp-iOS-Unsigned
          path: CMMSApp-unsigned.ipa
          retention-days: 14
