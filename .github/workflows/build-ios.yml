name: Build iOS IPA (Unsigned / Jailbreak)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install npm dependencies
        run: npm install --legacy-peer-deps

      - name: Setup Ruby and Bundler
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Install CocoaPods
        run: |
          cd ios
          bundle exec pod install || pod install --repo-update

      - name: Build unsigned iOS app
        run: |
          xcodebuild clean build \
            -workspace ios/CMMSApp.xcworkspace \
            -scheme CMMSApp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath derived_data \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package IPA
        run: |
          APP_PATH="derived_data/Build/Products/Release-iphoneos/CMMSApp.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Error: $APP_PATH not found"
            exit 1
          fi
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r CMMSApp-unsigned.ipa Payload
          rm -rf Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CMMSApp-iOS-Unsigned
          path: CMMSApp-unsigned.ipa
          retention-days: 14
